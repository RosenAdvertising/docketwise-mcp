[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "docketwise-mcp"
version = "0.1.0"
description = "MCP server for DocketWise: contacts, matters, documents and invoices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1,<0.29",
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/RosenAdvertising/docketwise-mcp"
Repository = "https://github.com/RosenAdvertising/docketwise-mcp"
Issues = "https://github.com/RosenAdvertising/docketwise-mcp/issues"

[project.scripts]
docketwise-mcp-setup = "docketwise_mcp.setup:setup"
docketwise-mcp-verify = "docketwise_mcp.setup:verify"
docketwise-mcp = "docketwise_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23,<0.24",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["docketwise_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
